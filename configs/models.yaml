# Provider entries. API keys come from the environment. Nothing here is a secret.
deepseek_flash:
  kind: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  billable: true
  prices: configs/prices/deepseek_2026-10-24.yaml
  # DeepSeek documents response_format json_object, not json_schema. Typed and
  # evidence sub-agents get the claim schema in the prompt and are parsed from text.
  json_schema_outputs: false
local_primary:
  kind: vllm
  base_url: http://127.0.0.1:8000/v1
  model: primitive-ai/Qwen3.8-Flash-Next-NVFP4
  api_key_env: VLLM_API_KEY
  api_key_default: EMPTY
  billable: false
  prices: configs/prices/local_zero.yaml
mock:
  kind: scripted
  model: mock-scripted
  billable: false
  prices: configs/prices/local_zero.yaml
# Scripted L3 judge: replies by matching the claim text (providers.scripted.KeyedFixtureModel).
mock_judge:
  kind: scripted
  model: mock-judge
  script: tests/fixtures/judge/synthetic.json
  billable: false
  prices: configs/prices/local_zero.yaml
openrouter_pinned:
  kind: openrouter
  base_url: https://openrouter.ai/api/v1
  model: deepseek/deepseek-chat
  api_key_env: OPENROUTER_API_KEY
  http_referer: https://example.com/evcarry
  x_title: evcarry
  billable: true
  prices: configs/prices/openrouter_example_2026-10-24.yaml
  json_schema_outputs: false
  routing:
    order: [deepseek]
    allow_fallbacks: false
    require_parameters: true
free_debug:
  kind: openai_compatible
  base_url_env: FREE_DEBUG_BASE_URL
  model_env: FREE_DEBUG_MODEL
  api_key_env: FREE_DEBUG_API_KEY
  billable: false
  prices: configs/prices/local_zero.yaml
openrouter_ds_1017:
  # DeepSeek V4.1 Flash 1017 via OpenRouter, pinned to a fixed set of FP8 endpoints, standard tier
  # (DeepSeek's own endpoint is blocked by the account's training-data privacy setting).
  # DeepInfra first; OpenRouter moves a call to the next tag when one answers 429. A call served by
  # any endpoint outside the set fails the run. Slug and prices checked on OpenRouter 2026-10-24;
  # each endpoint served a tool call (docs/evidence/endpoint_probe_2026-10-24.json).
  kind: openrouter
  base_url: https://openrouter.ai/api/v1
  model: deepseek/deepseek-v4.1-flash-1017
  api_key_env: OPENROUTER_API_KEY
  http_referer: https://github.com/viinayakpk/evidence-subagents
  x_title: evcarry
  billable: true
  prices: configs/prices/openrouter_deepseek_1017_2026-10-24.yaml
  json_schema_outputs: false
  routing:
    only: [deepinfra/fp8, inference-net/fp8, inference-net/us]
    order: [deepinfra/fp8, inference-net/fp8, inference-net/us]
    # inference-net/us has no fp8 segment in its tag; this filter keeps it (and the pin check) fp8.
    quantizations: [fp8]
    allow_fallbacks: false
    require_parameters: true
    # Sent as the top-level service_tier. Without it OpenRouter let deepinfra/fp8/priority (1.5x price)
    # serve under the deepinfra/fp8 slug and the pin check stopped the first pilot attempt (2026-10-24).
    service_tier: default
  # L3 judge calls only (agents: agent_extra_body below). Fixed 2026-10-25, before the judge sample is
  # hand-labelled (P3-3): reasoning stays on at low effort. In the pilot, under the provider default, 86% of
  # the judge's 182k output tokens were hidden reasoning. All three endpoints list `reasoning` and
  # `reasoning_effort` in supported_parameters (docs/evidence/openrouter_endpoints_..._2026-10-24b.json), so
  # require_parameters still matches the set. Changing it after the hand labels invalidates them.
  judge_extra_body:
    reasoning: {effort: low}
  # Agent calls only: main agent and sub-agents, every arm (C6, plan amendment A19, 2026-10-25). Pinned to the
  # model's OpenRouter default, so every endpoint of the set gets the same explicit setting and the dev runs'
  # behaviour is kept: GET /api/v1/models lists default_enabled: true, default_effort: high, supported efforts
  # max/high/low/none (docs/evidence/openrouter_model_deepseek-v4.1-flash-1017_2026-10-25.json). All three
  # endpoints list `reasoning` in supported_parameters (the 2026-10-24b endpoints file above).
  agent_extra_body:
    reasoning: {effort: high}
