# Pinned OpenRouter debug grid. Not the headline model. Cap is a small example.
# Needs OPENROUTER_API_KEY. Refuses until Docker is enabled, same as the pilot.
experiment: openrouter_debug
tasks: tasks/pilot10.txt
arms: [sa, vanilla_mad, self_verify, evidence_risk]
seeds: [1]
model: openrouter_pinned
audit: {sampler: risk, rate: 0.3, checks: [L0, L1, L2, L3]}
judge_model: lexical
limits: {max_steps: 40, max_seconds: 600, context: 32000}
prompts: prompts/gym_v1
budget: {cap_usd: 5, schedule: any}
parallel_tasks: 2
out: runs/openrouter_debug
environment: docker
task_root: third_party/toolathlon_gym/tasks/finalpool
