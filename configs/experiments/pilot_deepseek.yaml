# DeepSeek-V4.1-Flash-1017 through OpenRouter, pinned to DeepInfra's fp8 endpoint (openrouter_ds_1017).
# The L3 judge is the same model: billed, and counted toward the cap. Needs OPENROUTER_API_KEY.
# The OpenRouter price table has no peak windows; offpeak_only matters only if the model is switched back to deepseek_flash.
experiment: pilot_deepseek
tasks: tasks/pilot10.txt
arms: [sa, vanilla_mad, self_verify, evidence_risk]
seeds: [1]
model: openrouter_ds_1017
audit: {sampler: risk, rate: 0.3, checks: [L0, L1, L2, L3]}
judge_model: openrouter_ds_1017
# Owner decision 5: main agent and every sub-agent run at most 40 turns, every arm.
limits: {max_steps: 40, subagent_max_turns: 40, max_seconds: 7200, context: 131072}
prompts: prompts/gym_v1
# A run whose spend (agent + judge) reaches $0.25 is stopped: status cost_ceiling, counted as failed.
budget: {cap_usd: 5, run_ceiling_usd: 0.25, schedule: offpeak_only}
parallel_tasks: 4
out: runs/pilot_deepseek
environment: docker
task_root: third_party/toolathlon_gym/tasks/finalpool
