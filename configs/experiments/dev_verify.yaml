# Fix verification on the dev tasks (split evcarry-split-v1, pre-registered 2026-10-25): the two tasks of
# tasks/dev.txt, drawn by rule evcarry-dev-v1 from pool160 minus subset70, never pilot10. Same settings as the headline
# (100 turns, reference-priced $0.17 ceiling, enforced 131k context, no internet, no gym tree), one seed.
# Not run yet. Expected spend about $0.8-1.1 at the pilot's provider mix (docs/STATUS_fixes.md); the cap stops it at $1.50.
# Needs OPENROUTER_API_KEY and the gym images rebuilt after 2026-10-25 (make gym-images).
#   set -a; source .env; set +a; uv run evcarry run configs/experiments/dev_verify.yaml
experiment: dev_verify_v1
tasks: tasks/dev.txt
arms: [sa, vanilla_mad, self_verify, evidence_risk]
seeds: [1]
model: openrouter_ds_1017
audit: {sampler: risk, rate: 0.3, checks: [L0, L1, L2, L3]}
judge_model: openrouter_ds_1017
limits: {max_steps: 100, subagent_max_turns: 100, max_seconds: 7200, context: 131072}
prompts: prompts/gym_v1
# Dev runs exist to check the fixes before the prompts are frozen.
require_frozen_prompts: false
budget: {cap_usd: 1.5, run_ceiling_usd: 0.17, ceiling_basis: reference, reserve_billed_per_reference: 1.6, schedule: offpeak_only}
# Two tasks x four arms. The reserve ($0.33 billed per run in flight) lets four runs start at once under the $1.50 cap:
# the grid is task-major, so the four arms of a task start together and meet the same provider conditions.
parallel_tasks: 8
out: runs/dev_verify_v1
environment: docker
task_root: third_party/toolathlon_gym/tasks/finalpool
gym: {network_internal: true, hide_task_dir: true}
