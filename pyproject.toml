[project]
name = "evcarry"
version = "0.1.0"
description = "Evidence-carrying sub-agent returns with spot-check audits"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vinayak" }]
dependencies = [
    "openai-agents>=0.24,<0.25",
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
    "pyyaml>=6",
    "pandas>=2.2",
    "pyarrow>=18",
    "httpx2>=2.16,<3",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
evcarry = "evcarry.runs.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_provider: calls a real OpenAI-compatible endpoint (opt-in)",
]

[tool.uv]
package = true
